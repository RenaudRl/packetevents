org.gradle.jvmargs=-Xmx2000m
org.gradle.parallel=true

# Fork BTC Studio -- support Minecraft 26.3.
#
# Pas de suffixe BTC dans la version, et ce n'est pas un choix : PEVersionTask.kt impose
#   (\d+)\.(\d+)\.(\d+)(?:\+([0-9a-f]+)-SNAPSHOT)?
# et rejette tout qualificatif. Un `2.13.0-26.3-BTC-1` echoue sur generateVersionsFile.
# On garde donc le numero que l'amont se donne lui-meme pour cette ligne de developpement.
#
# Etat amont embarque : branche 2.0, fusion 252c98c40 puis 2026-10-27 (apres le tag amont v2.14.0),
# support 26.3 (PR #1582).
# Dernier tag amont dans cet arbre : v2.14.0. Notre depot statique est servi par
# un filtre exclusiveContent, il est la seule source de ces modules.
#
# 2.14.1 = 2.14.0 + correctif 4867f8e02 (la texture des tetes, composant `object`,
# survit a l'aller-retour NBT). 2.14.2 = 2.14.1 + resynchro amont 2.0 du 27/10/2026
# (53 commits). Une coordonnee publiee n'est JAMAIS ecrasee : un correctif prend le
# numero suivant.
#
# snapshot=false, et c'est le point important : la coordonnee doit etre IMMUABLE parce que
# le moteur Typewriter et 16 extensions vont l'epingler. Un -SNAPSHOT se serait deplace
# sous elles sans prevenir.
fullVersion=2.14.2
snapshot=false

publishing.display_name=PacketEvents
publishing.modrinth.project=HYKaKraK
